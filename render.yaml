# Render blueprint — deploys the whole MIV Hub as ONE free web service.
# The Node server builds the React front (client/dist) and serves it alongside the API.
# In Render: New + → "Blueprint" → pick the MIV-26 repo → set the secret env vars below.
services:
  - type: web
    name: miv-hub
    runtime: node
    plan: free
    # Build the front, install the server, and seed the SQLite database with the curriculum.
    buildCommand: npm --prefix client install && npm --prefix client run build && npm --prefix server install && npm --prefix server run seed
    startCommand: npm --prefix server start
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Signs admin sessions — generated once, kept secret.
      - key: JWT_SECRET
        generateValue: true
      # Admin password for /admin (set your own in the Render dashboard).
      - key: ADMIN_PASSWORD
        sync: false
      # Google Gemini key(s) for the AI assistant — comma-separated (optional).
      - key: GEMINI_API_KEYS
        sync: false
      # Same-origin front + API, so leave the API open.
      - key: CORS_ORIGIN
        value: "*"
